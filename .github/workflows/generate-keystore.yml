name: Generate Sheen Keystore (One-Time)

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Release Keystore & Base64
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore sheen-upload-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Sheen, OU=Mobile, O=Sheen, L=Mysuru, ST=Karnataka, C=IN"

          base64 -w 0 sheen-upload-key.jks > keystore-base64.txt

      - name: Upload Keystore Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sheen-Keystore-Backup-KEEP-PRIVATE
          path: |
            sheen-upload-key.jks
            keystore-base64.txt
          retention-days: 1
